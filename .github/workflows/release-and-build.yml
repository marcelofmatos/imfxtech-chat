name: Release and Build

# Manually triggered: bumps the app version, tags it, and builds an Android
# release APK (signed with our own keystore) and an iOS build, publishing
# both as a GitHub Release.
#
# iOS is signed and uploaded to TestFlight automatically once the signing
# secrets below exist in the repo; until then it falls back to an unsigned
# (--no-codesign) build attached to the GitHub Release. See
# docs/IOS_RELEASE_SIGNING.md for how to provision the secrets:
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
#   IOS_PROVISIONING_PROFILE_APP_BASE64,
#   IOS_PROVISIONING_PROFILE_SHARE_BASE64,
#   IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64, IOS_TEAM_ID,
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT (base64 .p8)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-and-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version
        id: bump
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          NEW_VERSION=$(python3 scripts/bump_version.py "$BUMP_KIND")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml snap/snapcraft.yaml
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "$NEW_TAG"
          git push origin HEAD:main
          git push origin "$NEW_TAG"

  build-android:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: ./.github/actions/free_up_space
        with:
          target: android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/imfxtech-chat-release.keystore
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=imfxtech-chat-release.keystore
          PROPS
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mv build/app/outputs/apk/release/app-release.apk \
             "build/app/outputs/apk/release/imfxtech-chat-$NEW_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-android
          path: build/app/outputs/apk/release/imfxtech-chat-*.apk

  build-ios:
    needs: bump-version
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Check iOS signing secrets
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Signed path (used once the secrets in docs/IOS_RELEASE_SIGNING.md exist) ---
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          readarray -t EXISTING_KEYCHAINS < <(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s build.keychain "${EXISTING_KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: Install provisioning profiles
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISIONING_PROFILE_APP_BASE64" | base64 -d > "$PROFILES_DIR/app.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_SHARE_BASE64" | base64 -d > "$PROFILES_DIR/share.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64" | base64 -d > "$PROFILES_DIR/notification.mobileprovision"
      - name: Generate ExportOptions.plist
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST
      - name: Build signed iOS app
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Rename signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: mv build/ios/ipa/*.ipa "build/ios/ipa/imfxtech-chat-$NEW_VERSION.ipa"
      - name: Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane upload_testflight ipa_path:"../build/ios/ipa/imfxtech-chat-$NEW_VERSION.ipa"

      # --- Fallback: unsigned build, still attached to the GitHub Release ---
      - name: Build unsigned iOS app
        if: steps.signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "imfxtech-chat-$NEW_VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-ios
          path: build/ios/ipa/imfxtech-chat-*.ipa

  create-release:
    needs: [bump-version, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imfxtech-chat-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: imfxtech-chat-ios
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.bump-version.outputs.tag }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
          REPO: ${{ github.repository }}
          IOS_SIGNED: ${{ needs.build-ios.outputs.signed }}
        run: |
          if [ "$IOS_SIGNED" = "true" ]; then
            IOS_NOTE="iOS build is signed and was uploaded to TestFlight automatically. The .ipa attached here is the same signed build."
          else
            IOS_NOTE="iOS build is unsigned (--no-codesign) — needs an Apple Developer certificate/provisioning profile to install on a real device. Android APK is signed with our release keystore and ready to install."
          fi
          gh release create "$NEW_TAG" \
            dist/imfxtech-chat-"$NEW_VERSION".apk \
            dist/imfxtech-chat-"$NEW_VERSION"*.ipa \
            --repo "$REPO" \
            --title "IMFxTech Chat $NEW_VERSION" \
            --generate-notes \
            --notes "$IOS_NOTE"
