name: Release and Build

# Manually triggered: bumps the app version, tags it, and builds an Android
# release APK (signed with our own keystore), an iOS build and a macOS .dmg,
# publishing them as a GitHub Release.
#
# Android is additionally uploaded to the Google Play "internal" track
# automatically once PLAY_STORE_JSON_KEY exists in the repo; until then it
# only builds the signed APK attached to the GitHub Release. A failed Play
# upload only warns: it never blocks the GitHub Release. See
# docs/GOOGLE_PLAY_PUBLISHING.md for how to provision that secret.
#
# iOS is signed and uploaded to TestFlight automatically once the signing
# secrets below exist in the repo; until then it falls back to an unsigned
# (--no-codesign) build attached to the GitHub Release. See
# docs/IOS_RELEASE_SIGNING.md for how to provision the secrets:
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
#   IOS_PROVISIONING_PROFILE_APP_BASE64,
#   IOS_PROVISIONING_PROFILE_SHARE_BASE64,
#   IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64, IOS_TEAM_ID,
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT (base64 .p8)
#
# macOS is packaged as a .dmg attached to the GitHub Release. Once the
# Developer ID secrets exist it is signed and notarized (reusing the ASC_*
# API key); until then the .dmg is unsigned. See docs/MACOS_RELEASE.md:
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD
#
# macOS is separately packaged as a .pkg and uploaded straight to App Store
# Connect (Mac App Store) once its signing secrets exist; until then that job
# just checks out and exits — it is not required for the GitHub Release. See
# docs/MACOS_APPSTORE_RELEASE.md:
#   MACOS_APPSTORE_CERTIFICATE_P12_BASE64, MACOS_APPSTORE_CERTIFICATE_PASSWORD,
#   MACOS_INSTALLER_CERTIFICATE_P12_BASE64, MACOS_INSTALLER_CERTIFICATE_PASSWORD,
#   MACOS_PROVISIONING_PROFILE_STORE_BASE64
#   (reuses ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT — não reaproveita o
#   certificado do iOS: é "iOS Distribution" legado, só funciona pra iOS)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-and-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version
        id: bump
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          NEW_VERSION=$(python3 scripts/bump_version.py "$BUMP_KIND")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml snap/snapcraft.yaml
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "$NEW_TAG"
          git push origin HEAD:main
          git push origin "$NEW_TAG"

  build-android:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: ./.github/actions/free_up_space
        with:
          target: android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/imfxtech-chat-release.keystore
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=imfxtech-chat-release.keystore
          PROPS
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mv build/app/outputs/apk/release/app-release.apk \
             "build/app/outputs/apk/release/imfxtech-chat-$NEW_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-android
          path: build/app/outputs/apk/release/imfxtech-chat-*.apk

      # The .aab is always kept as an artifact: Google Play only accepts API
      # uploads after the first bundle was uploaded by hand in the Play Console.
      - name: Build release App Bundle
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/imfxtech-chat-$NEW_VERSION.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-android-aab
          path: build/app/outputs/bundle/release/imfxtech-chat-*.aab

      # --- Google Play upload (used once PLAY_STORE_JSON_KEY exists, see docs/GOOGLE_PLAY_PUBLISHING.md) ---
      - name: Check Google Play signing secret
        id: play_signing
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # A Play não bloqueia a GitHub Release: se a conta ou o app estiverem
      # suspensos (ou a Play recusar o upload), o APK assinado já foi gerado e
      # a release sai assim mesmo. A falha vira um aviso no resumo do run.
      - name: Upload to Google Play (internal track)
        id: play_upload
        if: steps.play_signing.outputs.enabled == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.imfxtech.chat
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          # "draft" while the app was never published (Play rejects anything
          # else on a draft app); set the repo variable to "completed" after.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
      - name: Warn about failed Google Play upload
        if: steps.play_upload.outcome == 'failure'
        run: echo "::warning title=Google Play::Upload to Google Play failed; the GitHub Release is still created with the APK. Check the Play Console."

  build-ios:
    needs: bump-version
    # Intel: a fila de macOS arm64 cancelou o job 4x seguidas por falta de capacidade.
    # macOS 26 (Xcode 26 padrão): a App Store exige o SDK do iOS 26 e o Xcode 16 do
    # macos-15-intel quebrou ao resolver os pacotes Swift.
    runs-on: macos-26-intel
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Check iOS signing secrets
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Signed path (used once the secrets in docs/IOS_RELEASE_SIGNING.md exist) ---
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: Install provisioning profiles
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISIONING_PROFILE_APP_BASE64" | base64 -d > "$PROFILES_DIR/app.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_SHARE_BASE64" | base64 -d > "$PROFILES_DIR/share.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_NOTIFICATION_BASE64" | base64 -d > "$PROFILES_DIR/notification.mobileprovision"
      - name: Generate ExportOptions.plist
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.imfxtech.chat</key>
              <string>IMFxTech Chat App Store</string>
              <key>com.imfxtech.chat.Share</key>
              <string>IMFxTech Chat Share App Store</string>
              <key>com.imfxtech.chat.NotificationService</key>
              <string>IMFxTech Chat Notification App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: Build signed iOS app
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Rename signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: mv build/ios/ipa/*.ipa "build/ios/ipa/imfxtech-chat-$NEW_VERSION.ipa"
      - name: Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" | base64 -d > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios \
            -f "build/ios/ipa/imfxtech-chat-$NEW_VERSION.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # --- Fallback: unsigned build, still attached to the GitHub Release ---
      - name: Build unsigned iOS app
        if: steps.signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "imfxtech-chat-$NEW_VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-ios
          path: build/ios/ipa/imfxtech-chat-*.ipa

  build-macos:
    needs: bump-version
    # Mesmo runner do build-ios (ver comentário lá, capacidade do runner arm64
    # é instável). Build é só arm64 (ver EXCLUDED_ARCHS em Release.xcconfig: o
    # webcrypto trava no x86_64, bug do BoringSSL vendorizado) -- o runner
    # Intel só compila cruzado para arm64, não roda o binário final.
    runs-on: macos-26-intel
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      # Build sempre com assinatura ad-hoc: o projeto usa assinatura automática
      # do team, que exige uma conta Apple logada no Xcode. O caminho assinado
      # reassina o .app com o certificado Developer ID depois do build.
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
      FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: flutter pub get
      - name: Check macOS signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 ausente: o .dmg do macOS sai sem assinatura Developer ID e sem notarização (ver docs/MACOS_RELEASE.md)."
          fi
      - name: Build macOS app
        run: flutter build macos --release
      - name: Locate app bundle
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # --- Signed path (used once the secrets in docs/MACOS_RELEASE.md exist) ---
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | awk '{print $2}')
          [ -n "$IDENTITY" ] || { echo "::error::Developer ID Application não encontrado no .p12"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Sign app with Developer ID
        if: steps.signing.outputs.enabled == 'true'
        run: |
          find "$APP_PATH/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" {} \;
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package DMG
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p build/macos/dmg/staging
          cp -R "$APP_PATH" build/macos/dmg/staging/
          ln -s /Applications build/macos/dmg/staging/Applications
          hdiutil create -volname "IMFxTech Chat" -srcfolder build/macos/dmg/staging \
            -ov -format UDZO "build/macos/dmg/imfxtech-chat-$NEW_VERSION-macos.dmg"

      - name: Sign and notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          DMG="build/macos/dmg/imfxtech-chat-$NEW_VERSION-macos.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" | base64 -d > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun notarytool submit "$DMG" \
            --key ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: imfxtech-chat-macos
          path: build/macos/dmg/imfxtech-chat-*-macos.dmg
      - name: Clean up signing material
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 ~/.private_keys/AuthKey_*.p8

  build-macos-store:
    needs: bump-version
    # Mesmo runner dos outros jobs macOS (ver comentário no build-ios).
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: flutter pub get
      - name: Check Mac App Store signing secrets
        id: signing
        env:
          MACOS_APPSTORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APPSTORE_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_PROVISIONING_PROFILE_STORE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_STORE_BASE64 }}
        run: |
          if [ -n "$MACOS_APPSTORE_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_PROVISIONING_PROFILE_STORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets da Mac App Store ausentes: job pulado (ver docs/MACOS_APPSTORE_RELEASE.md)."
          fi

      # --- Signed path (used once the secrets in docs/MACOS_APPSTORE_RELEASE.md exist) ---
      - name: Import Mac App Distribution and Mac Installer Distribution certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_APPSTORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APPSTORE_CERTIFICATE_P12_BASE64 }}
          MACOS_APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPSTORE_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" store.keychain
          security set-keychain-settings -lut 21600 store.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" store.keychain
          echo "$MACOS_APPSTORE_CERTIFICATE_P12_BASE64" | base64 -d > app.p12
          echo "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -d > installer.p12
          security import app.p12 -k store.keychain -P "$MACOS_APPSTORE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import installer.p12 -k store.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s store.keychain $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" store.keychain
          rm app.p12 installer.p12
          # CN real do certificado "Mac App Distribution"/"Mac Installer Distribution" no
          # portal ainda usa o nome legado "3rd Party Mac Developer ...".
          APP_IDENTITY=$(security find-identity -v -p codesigning store.keychain | grep "3rd Party Mac Developer Application" | head -n 1 | awk '{print $2}')
          INSTALLER_IDENTITY=$(security find-identity -v store.keychain | grep "3rd Party Mac Developer Installer" | head -n 1 | awk '{print $2}')
          [ -n "$APP_IDENTITY" ] || { echo "::error::Mac App Distribution não encontrado no .p12"; exit 1; }
          [ -n "$INSTALLER_IDENTITY" ] || { echo "::error::Mac Installer Distribution não encontrado no .p12"; exit 1; }
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
      - name: Install Mac App Store provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_PROVISIONING_PROFILE_STORE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_STORE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MACOS_PROVISIONING_PROFILE_STORE_BASE64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/macos-store.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE_STORE_BASE64" | base64 -d > profile.provisionprofile
      - name: Build macOS app
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build macos --release
      - name: Locate app bundle
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Sign app with Apple Distribution
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cp profile.provisionprofile "$APP_PATH/Contents/embedded.provisionprofile"
          find "$APP_PATH/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" {} \;
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$APP_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Package signed .pkg installer
        if: steps.signing.outputs.enabled == 'true'
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p build/macos/pkg
          productbuild --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "build/macos/pkg/imfxtech-chat-$NEW_VERSION-macos-appstore.pkg"
      - name: Upload to App Store Connect
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" | base64 -d > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type macos \
            -f "build/macos/pkg/imfxtech-chat-$NEW_VERSION-macos-appstore.pkg" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Not a GitHub Release asset: a Mac App Store .pkg isn't notarized on its
      # own (trust comes from the store receipt), so Gatekeeper blocks it for
      # anyone who downloads it outside the store. Kept only for audit.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: imfxtech-chat-macos-appstore
          path: build/macos/pkg/imfxtech-chat-*-appstore.pkg
      - name: Clean up signing material
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain store.keychain || true
          rm -f app.p12 installer.p12 profile.provisionprofile ~/.private_keys/AuthKey_*.p8

  create-release:
    needs: [bump-version, build-android, build-ios, build-macos]
    # O macOS não bloqueia a release: as lojas já receberam o Android e o iOS,
    # então a GitHub Release sai mesmo se o build ou a notarização do macOS
    # falhar. Nesse caso ela só não leva o .dmg.
    if: >-
      always() &&
      needs.bump-version.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imfxtech-chat-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: imfxtech-chat-ios
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.build-macos.result == 'success'
        with:
          name: imfxtech-chat-macos
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.bump-version.outputs.tag }}
          NEW_VERSION: ${{ needs.bump-version.outputs.version }}
          REPO: ${{ github.repository }}
          IOS_SIGNED: ${{ needs.build-ios.outputs.signed }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          MACOS_SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          if [ "$IOS_SIGNED" = "true" ]; then
            IOS_NOTE="iOS build is signed and was uploaded to TestFlight automatically. The .ipa attached here is the same signed build."
          else
            IOS_NOTE="iOS build is unsigned (--no-codesign) — needs an Apple Developer certificate/provisioning profile to install on a real device. Android APK is signed with our release keystore and ready to install."
          fi
          NOTES="$IOS_NOTE"
          ASSETS=(dist/imfxtech-chat-"$NEW_VERSION".apk dist/imfxtech-chat-"$NEW_VERSION"*.ipa)
          if [ "$MACOS_RESULT" = "success" ]; then
            if [ "$MACOS_SIGNED" = "true" ]; then
              MACOS_NOTE="macOS .dmg is signed with Developer ID and notarized by Apple."
            else
              MACOS_NOTE="macOS .dmg is not signed with Developer ID nor notarized — Gatekeeper blocks the first launch (right-click > Open to bypass)."
            fi
            NOTES="$NOTES"$'\n\n'"$MACOS_NOTE"
            ASSETS+=(dist/imfxtech-chat-"$NEW_VERSION"-macos.dmg)
          fi
          gh release create "$NEW_TAG" \
            "${ASSETS[@]}" \
            --repo "$REPO" \
            --title "IMFxTech Chat $NEW_VERSION" \
            --generate-notes \
            --notes "$NOTES"
